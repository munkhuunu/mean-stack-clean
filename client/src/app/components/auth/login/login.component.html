<div class="min-vh-100 d-flex align-items-center bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-tasks text-primary" style="font-size: 3rem;"></i>
                            <h2 class="mt-3 mb-1">Welcome Back</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>

                        <!-- Alert -->
                        <div *ngIf="errorMessage" class="alert alert-danger fade-in" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            {{ errorMessage }}
                        </div>

                        <div *ngIf="successMessage" class="alert alert-success fade-in" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            {{ successMessage }}
                        </div>

                        <!-- Login Form -->
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                      <span class="input-group-text">
                        <i class="fas fa-envelope"></i>
                      </span>
                                    <input
                                            type="email"
                                            class="form-control"
                                            id="email"
                                            formControlName="email"
                                            placeholder="Enter your email"
                                            [class.is-invalid]="email?.invalid && email?.touched">
                                </div>
                                <div *ngIf="email?.invalid && email?.touched" class="invalid-feedback">
                                    <div *ngIf="email?.errors?.['required']">Email is required</div>
                                    <div *ngIf="email?.errors?.['email']">Please enter a valid email</div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                      <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                      </span>
                                    <input
                                            [type]="showPassword ? 'text' : 'password'"
                                            class="form-control"
                                            id="password"
                                            formControlName="password"
                                            placeholder="Enter your password"
                                            [class.is-invalid]="password?.invalid && password?.touched">
                                    <button
                                            type="button"
                                            class="btn btn-outline-secondary"
                                            (click)="togglePassword()">
                                        <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                    </button>
                                </div>
                                <div *ngIf="password?.invalid && password?.touched" class="invalid-feedback">
                                    <div *ngIf="password?.errors?.['required']">Password is required</div>
                                </div>
                            </div>

                            <button
                                    type="submit"
                                    class="btn btn-primary w-100 mb-3"
                                    [disabled]="loginForm.invalid || isLoading">
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                                <i *ngIf="!isLoading" class="fas fa-sign-in-alt me-2"></i>
                                {{ isLoading ? 'Signing In...' : 'Sign In' }}
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="mb-0">
                                Don't have an account?
                                <a routerLink="/register" class="text-decoration-none">Sign up here</a>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Demo Credentials -->
                <div class="card mt-3 bg-light">
                    <div class="card-body text-center">
                        <small class="text-muted">
                            <strong>Demo:</strong> Use any email and password to test the application
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
